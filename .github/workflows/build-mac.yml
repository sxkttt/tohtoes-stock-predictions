name: Build macOS app

# Builds "Tohtoe's Stock Predictions for Mac.app" + an installer .dmg on
# GitHub's own macOS runners -- no local Mac needed. Triggers on every push
# to main, and can also be run on demand from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write  # needed to publish the release below

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-build.txt

      - name: Build .app
        run: pyinstaller tohtoe.spec --noconfirm

      - name: Package .dmg
        run: |
          chmod +x build_dmg.sh
          ./build_dmg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: TohtoeStockPredictionsForMac
          path: dist/TohtoeStockPredictionsForMac.dmg
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mac-latest
          name: "Tohtoe's Stock Predictions for Mac (latest)"
          body: |
            Automatically built from the latest `main` on GitHub's macOS runners.
            Download `TohtoeStockPredictionsForMac.dmg` below, open it, and drag
            the app onto the Applications shortcut. It's unsigned, so the first
            launch needs right-click > Open to get past Gatekeeper.
          files: dist/TohtoeStockPredictionsForMac.dmg
          make_latest: true
